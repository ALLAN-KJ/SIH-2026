config setup
    charondebug="ike 4, net 4"
    uniqueids=no

conn %default
    ikelifetime=60m
    keylife=20m
    rekeymargin=3m
    keyingtries=1
    authby=secret
    keyexchange=ikev2

conn weak-tunnel
    left=%any
    leftsubnet=0.0.0.0/0
    right=%any
    rightsubnet=0.0.0.0/0
    ike=3des-sha256-modp1024!
    esp=3des-sha256!
    auto=add
